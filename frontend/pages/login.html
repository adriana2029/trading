<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trading Simulador - Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="login-container">

        <h1>Trading Simulador</h1>

        <h2>Iniciar sesión</h2>

        <form id="loginForm">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                placeholder="correo@ejemplo.com"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Ingresa tu contraseña"
                required
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <p id="message"></p>

        <p>
            ¿No tienes una cuenta?
            <a href="registro.html">Crear cuenta</a>
        </p>

    </div>

    <script src="../js/login.js"></script>

</body>

</html>
