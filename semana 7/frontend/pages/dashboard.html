<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trading Simulador</title>

    <link rel="stylesheet" href="../css/dashboard.css">

</head>


<body>


    <!-- ENCABEZADO -->

    <header>

        <h1>Trading Simulador</h1>

        <div class="user-area">

            <span id="welcome"></span>

            <button id="logoutButton">
                Cerrar sesión
            </button>

        </div>

    </header>



    <main>


        <!-- SALDO -->

        <section class="balance">

            <h2>Mi cuenta</h2>

            <p class="balance-label">
                Saldo disponible
            </p>

            <p id="balance">
                $10,000.00
            </p>

        </section>



        <!-- MERCADO / CREAR OPERACIÓN -->

        <section class="market">

            <h2>Crear operación</h2>


            <div class="asset-card">


                <!-- ACTIVO -->

                <h3>BTC / USD</h3>

                <p class="price">
                    $60,000.00
                </p>



                <!-- CANTIDAD -->

                <label for="quantity">
                    Cantidad de BTC
                </label>

                <input
                    type="number"
                    id="quantity"
                    placeholder="Ejemplo: 0.5"
                    step="0.01"
                    min="0.01"
                >



                <!-- PRECIO -->

                <label for="price">
                    Precio
                </label>

                <input
                    type="number"
                    id="price"
                    placeholder="Ejemplo: 60000"
                    step="0.01"
                    min="0"
                >



                <!-- STOP LOSS -->

                <label for="stopLoss">
                    Stop Loss
                </label>

                <input
                    type="number"
                    id="stopLoss"
                    placeholder="Ejemplo: 58000"
                    step="0.01"
                    min="0"
                >



                <!-- TAKE PROFIT -->

                <label for="takeProfit">
                    Take Profit
                </label>

                <input
                    type="number"
                    id="takeProfit"
                    placeholder="Ejemplo: 65000"
                    step="0.01"
                    min="0"
                >



                <!-- BOTONES -->

                <div class="trade-buttons">

                    <button id="buyButton">
                        Comprar
                    </button>

                    <button id="sellButton">
                        Vender
                    </button>

                </div>


            </div>

        </section>



        <!-- OPERACIONES -->

        <section class="operations">

            <h2>Mis operaciones</h2>


            <table>

                <thead>

                    <tr>

                        <th>Activo</th>

                        <th>Tipo</th>

                        <th>Cantidad</th>

                        <th>Precio</th>

                    </tr>

                </thead>


                <tbody id="operationsTable">

                    <tr>

                        <td colspan="4">
                            No hay operaciones todavía
                        </td>

                    </tr>

                </tbody>

            </table>


        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script src="../js/dashboard.js"></script>


</body>

</html>
