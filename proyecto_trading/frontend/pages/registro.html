<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trading Simulador - Registro</title>

    <link rel="stylesheet" href="../css/registro.css">
</head>

<body>

    <div class="registro-container">

        <h1>Trading Simulador</h1>

        <h2>Crear cuenta</h2>

        <form id="registroForm">

            <label for="name">
                Nombre
            </label>

            <input
                type="text"
                id="name"
                required
            >

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                required
            >

            <button type="submit">
                Registrarme
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="../js/registro.js"></script>

</body>

</html>
